name: Build Windows exe

on:
  push:
    branches: [ claude/everything-search-tool-pdztcu ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: EverythingClone
          path: build/Release/EverythingClone.exe
          retention-days: 90

      - name: Upload EverythingCore.dll
        uses: actions/upload-artifact@v4
        with:
          name: EverythingCore
          path: build/Release/EverythingCore.dll
          retention-days: 90
