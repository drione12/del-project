name: Build Windows exe

on:
  push:
    branches: [ claude/everything-search-tool-pdztcu ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # -A x64: the Visual Studio generator defaults to Win32 (x86) when no
      # -A is given, even on a 64-bit runner - EverythingCore.dll needs to
      # match the bitness of whatever process loads it via ctypes (Memory
      # Master's PyInstaller build, which actions/setup-python's default x64
      # Python makes 64-bit - see build-memory-master.yml). Building x86
      # here too, not just there, keeps this workflow's own
      # EverythingClone.exe/EverythingCore.dll artifacts consistent with
      # what package job actually ships.
      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: EverythingClone
          path: build/Release/EverythingClone.exe
          retention-days: 90

      - name: Upload EverythingCore.dll
        uses: actions/upload-artifact@v4
        with:
          name: EverythingCore
          path: build/Release/EverythingCore.dll
          retention-days: 90
