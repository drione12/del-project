name: Build Memory Master

on:
  push:
    branches: [ claude/everything-search-tool-pdztcu ]
    paths:
      - 'memory_master/**'
      - '.github/workflows/build-memory-master.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r memory_master/requirements.txt pytest

      - name: Run unit tests
        run: pytest memory_master/tests -v

      - name: PyQt5 import/construct smoke check
        env:
          QT_QPA_PLATFORM: offscreen
        run: python memory_master/scripts/smoke_check.py

  package:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Built fresh in this job (rather than reused from build.yml's own
      # artifact) so packaging never depends on a separate, independently
      # triggered workflow run being fresh/present - core/fast_search.py
      # loads EverythingCore.dll via ctypes at runtime, so it needs to be
      # bundled alongside MemoryMaster.exe. This also builds the
      # EverythingClone.exe target (cmake --build with no --target builds
      # everything in CMakeLists.txt), which Memory Master itself no longer
      # uses - left as-is for simplicity rather than adding a --target flag
      # to skip it, since it's a small extra build cost, not a bundled one.
      # -A x64: the Visual Studio generator defaults to Win32 (x86) when no
      # -A is given, even on a 64-bit runner. Without this,
      # EverythingCore.dll ends up 32-bit while actions/setup-python's
      # default x64 Python (below) makes MemoryMaster.exe 64-bit -
      # ctypes.WinDLL/CDLL cannot load a DLL of a different bitness than the
      # calling process at all (LoadLibrary fails outright), so this
      # mismatch silently disabled fast search (fell back to the slow
      # os.walk backend) in every previously-shipped build.
      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Bundle EverythingCore.dll into Memory Master resources
        run: Copy-Item build\Release\EverythingCore.dll memory_master\resources\EverythingCore.dll

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r memory_master/requirements.txt pyinstaller

      - name: Build with PyInstaller
        working-directory: memory_master
        run: pyinstaller --noconfirm --onefile --windowed --name MemoryMaster --add-data "resources;resources" main.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MemoryMaster
          path: memory_master/dist/MemoryMaster.exe
          retention-days: 90
